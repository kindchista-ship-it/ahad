<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>درباره برنامه</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; }
  body {
    margin:0; padding:24px 16px 40px; color:#fff; line-height:1.8;
    font-family:system-ui,Tahoma,sans-serif;
    background:radial-gradient(120% 80% at 50% -10%,#1d3d95 0%,#0c1f55 45%,#070f2c 100%) fixed;
    position:relative; overflow-x:hidden;
  }
  /* لکه‌های رنگی پشت شیشه */
  body:before, body:after { content:""; position:fixed; z-index:0; border-radius:50%; pointer-events:none; filter:blur(8px); }
  body:before { width:260px; height:260px; top:6%; right:-70px; background:radial-gradient(circle at 35% 35%,#ff5d7a,rgba(225,29,72,0) 70%); opacity:.75; }
  body:after  { width:300px; height:300px; bottom:4%; left:-90px; background:radial-gradient(circle at 60% 40%,#6ee7ff,rgba(56,130,255,0) 70%); opacity:.6; }
  .wrap { position:relative; z-index:1; max-width:480px; margin:0 auto; }
  .back { display:inline-block; color:#cfe0ff; text-decoration:none; margin-bottom:6px; }
  h1 { font-size:1.5rem; margin:4px 0 18px; text-shadow:0 2px 14px rgba(0,0,0,.35); }
  .glass {
    position:relative; border-radius:24px; padding:18px; margin-bottom:16px; overflow:hidden;
    background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.12));
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.28); border-top-color:rgba(255,255,255,.55);
    box-shadow:0 18px 44px rgba(2,8,30,.38), inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 26px rgba(255,255,255,.06);
  }
  .glass:before { content:""; position:absolute; left:8%; right:8%; top:0; height:36%; border-radius:0 0 50% 50%/0 0 100% 100%;
    background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0)); pointer-events:none; }
  .glass > * { position:relative; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
  .row + .row { border-top:1px solid rgba(255,255,255,.14); }
  .row span { color:#d6e2ff; }
  button, a.btn {
    display:block; width:100%; text-align:center; text-decoration:none; border-radius:16px; padding:13px; margin-top:10px;
    font:inherit; font-weight:600; color:#fff; cursor:pointer; touch-action:manipulation;
    border:1px solid rgba(255,255,255,.35); border-top-color:rgba(255,255,255,.6);
    background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.08));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 6px 16px rgba(2,8,30,.25);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    transition:transform .08s, background .08s;
  }
  button:active, a.btn:active { transform:scale(.97); background:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,.16)); }
  button.alt { background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02)); font-weight:500; }
  #msg { margin-top:12px; min-height:1.5em; color:#eaf1ff; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">→ بازگشت به برنامه</a>
  <h1>درباره برنامه</h1>
  <div class="glass">
    <div class="row"><span>نام برنامه</span><b>Mive yar</b></div>
    <div class="row"><span>نسخه</span><b id="ver" dir="ltr"></b></div>
  </div>
  <div class="glass">
    <button id="check">بررسی آپدیت</button>
    <button id="refresh" class="alt">تازه‌سازی محتوای برنامه</button>
    <div id="msg" role="status"></div>
    <a id="dl" class="btn" style="display:none">دانلود نسخه جدید</a>
  </div>
</div>
<script>
  var APP_VERSION = "1.0.0.1";
  document.getElementById("ver").textContent = APP_VERSION;
  var msg = document.getElementById("msg"), dl = document.getElementById("dl");

  function newer(a, b) {
    a = String(a).split(".").map(Number); b = String(b).split(".").map(Number);
    for (var i = 0; i < Math.max(a.length, b.length); i++) {
      var x = a[i] || 0, y = b[i] || 0;
      if (x !== y) return x > y;
    }
    return false;
  }

  document.getElementById("check").onclick = function () {
    msg.textContent = "در حال بررسی...";
    dl.style.display = "none";
    fetch("version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) {
        if (newer(j.version, APP_VERSION)) {
          msg.textContent = "نسخه جدید (" + j.version + ") موجوده." + (j.notes ? " " + j.notes : "");
          if (j.apk) { dl.href = j.apk; dl.style.display = "block"; }
        } else {
          msg.textContent = "شما آخرین نسخه رو دارید.";
        }
      })
      .catch(function () { msg.textContent = "بررسی انجام نشد. اتصال اینترنت رو چک کن."; });
  };

  document.getElementById("refresh").onclick = function () {
    msg.textContent = "در حال تازه‌سازی...";
    var jobs = [];
    if ("serviceWorker" in navigator)
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches)
      jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  };
</script>
</body>
</html>
